<rect x="60" y="578.0" width="300" height="46" rx="9" fill="#16233a" stroke="#7393d8" stroke-width="2"/>
<text x="210.0" y="608.0" font-size="19" font-weight="700" text-anchor="middle" fill="#e6edf3">Prior clinical evidence</text>
