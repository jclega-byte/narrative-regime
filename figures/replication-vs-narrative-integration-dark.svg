<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, 'Liberation Sans', 'DejaVu Sans', sans-serif">
<title id="title">From replication to narrative integration</title>
<desc id="desc">Two architectures of evidentiary justification. Panel A, replication-based architecture (two-trial paradigm): two independent randomized controlled trials each test the same target claim directly; credibility is strengthened by independent replication. Defining question: has the finding been independently reproduced? Panel B, narrative regime (independent replication limited or absent): eight heterogeneous evidence components (prior clinical evidence, pharmacokinetics, exposure-response, comparative clinical data, safety, immunogenicity, mechanistic evidence, external evidence) are connected by links a1 to a8, each carrying an inferential assumption, to an integrated inferential argument in which the coherence of components and links is judged and contradictions are assessed; this argument supports the target claim. A single invalid link can weaken the claim even when each study is internally valid. Defining question: do multiple sources of evidence, connected by defensible assumptions, form a sufficiently coherent and contradiction-resistant basis for the claim? Concept: Lega et al., J Clin Epidemiol 2026;199:112458.</desc>
<defs><marker id="mk-arrow" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 z" fill="#b1bac4"/></marker><marker id="mk-link" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 z" fill="#7393d8"/></marker></defs>

