<text x="1020.0" y="304.0" font-size="17" font-weight="400" text-anchor="middle" fill="#b1bac4">credibility strengthened</text>
<text x="1020.0" y="324.0" font-size="17" font-weight="400" text-anchor="middle" fill="#b1bac4">by replication</text>
<rect x="60" y="422" width="1080" height="44" rx="10" fill="#1c2129" stroke="#3d444d" stroke-width="1.5"/>
<text x="84" y="450" font-size="18" font-weight="700" text-anchor="start" fill="#e6edf3">Defining question</text>
<text x="254" y="450" font-size="18" font-weight="400" text-anchor="start" fill="#b1bac4">Has the finding been independently reproduced?</text>
