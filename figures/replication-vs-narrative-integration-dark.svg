<text x="710.0" y="835.0" font-size="17" font-weight="400" text-anchor="middle" fill="#b1bac4">and inferential links;</text>
<text x="710.0" y="858.0" font-size="17" font-weight="400" text-anchor="middle" fill="#b1bac4">contradictions assessed</text>
<path d="M 840 797.0 L 898 797.0" fill="none" stroke="#b1bac4" stroke-width="3" stroke-linecap="round" marker-end="url(#mk-arrow)"/>
<rect x="900" y="747.0" width="240" height="100" rx="10" fill="#18291a" stroke="#7fae64" stroke-width="2.5"/>
