<text x="1020.0" y="809.0" font-size="17" font-weight="400" text-anchor="middle" fill="#b1bac4">credibility strengthened</text>
<text x="1020.0" y="829.0" font-size="17" font-weight="400" text-anchor="middle" fill="#b1bac4">by judged coherence</text>
<rect x="580" y="925" width="560" height="91.0" rx="10" fill="#1c2129" stroke="#3d444d" stroke-width="1.5"/>
<text x="604" y="951" font-size="17" font-weight="400" text-anchor="start" fill="#b1bac4">Each link (a1–a8) carries an inferential assumption that</text>
<text x="604" y="974" font-size="17" font-weight="400" text-anchor="start" fill="#b1bac4">requires explicit justification. A single invalid link can</text>
<text x="604" y="997" font-size="17" font-weight="400" text-anchor="start" fill="#b1bac4">weaken the claim even if each study is internally valid.</text>
<rect x="60" y="1036" width="1080" height="68" rx="10" fill="#1c2129" stroke="#3d444d" stroke-width="1.5"/>
<text x="84" y="1064" font-size="18" font-weight="700" text-anchor="start" fill="#e6edf3">Defining question</text>
<text x="254" y="1064" font-size="18" font-weight="400" text-anchor="start" fill="#b1bac4">Do multiple sources of evidence, connected by defensible assumptions, form a</text>
<text x="254" y="1089" font-size="18" font-weight="400" text-anchor="start" fill="#b1bac4">sufficiently coherent and contradiction-resistant basis for the claim?</text>
<text x="600.0" y="1158" font-size="15" font-weight="400" text-anchor="middle" fill="#8b949e">Concept: Lega JC, Gougeon A, Michal C, et al. J Clin Epidemiol. 2026;199:112458. doi:10.1016/j.jclinepi.2026.112458</text>
<text x="600.0" y="1180" font-size="15" font-weight="400" text-anchor="middle" fill="#8b949e">Schematic representation: the components required in a given application depend on the target claim and regulatory context.</text>
</svg>
